name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testy jednostkowe (zapis, konflikty, NIP, terminy, raporty, umowy)
        run: npm test
      - name: Testy SQL (migracje v2–v6, RLS, uprawnienia) na PGlite
        run: npm run test:sql
      - name: Build
        run: npm run build
